<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>我们认识了多久？</title>
  <link rel="icon" href="custom-icon.png" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --accent: #e63946;
      --text-primary: #1d1d1d;
      --text-secondary: #888;
      --bg: #fafafa;
    }

    body {
      font-family: -apple-system, "SF Pro Display", "PingFang SC", "Helvetica Neue", sans-serif;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text-primary);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 24px;
      position: relative;
    }

    /* 顶部细线 */
    .top-line {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 3px;
      background: linear-gradient(90deg, var(--accent), #f4a261);
    }

    .container {
      max-width: 420px;
      width: 100%;
      text-align: left;
    }

    .names-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 60px;
    }

    .name {
      font-size: 1.1em;
      font-weight: 600;
      letter-spacing: 1px;
    }

    .name-right {
      text-align: right;
    }

    .heart-sep {
      color: var(--accent);
      font-size: 0.9em;
      margin: 0 12px;
    }

    .label {
      font-size: 0.9em;
      color: var(--text-secondary);
      letter-spacing: 4px;
      margin-bottom: 16px;
      font-weight: 300;
    }

    .big-number {
      font-size: 7em;
      font-weight: 700;
      line-height: 0.9;
      letter-spacing: -3px;
      margin-bottom: 8px;
      font-variant-numeric: tabular-nums;
    }

    .big-number .unit {
      font-size: 0.25em;
      font-weight: 400;
      color: var(--text-secondary);
      letter-spacing: 1px;
      margin-left: 8px;
    }

    .timer {
      display: flex;
      gap: 20px;
      margin: 20px 0 30px;
      font-variant-numeric: tabular-nums;
    }

    .timer-item {
      text-align: left;
    }

    .timer-num {
      font-size: 1.6em;
      font-weight: 600;
      color: var(--text-primary);
      line-height: 1;
    }

    .timer-label {
      font-size: 0.75em;
      color: var(--text-secondary);
      margin-top: 4px;
      letter-spacing: 1px;
    }

    .sub-info {
      font-size: 0.95em;
      color: var(--text-secondary);
      margin-bottom: 20px;
      line-height: 1.6;
    }

    .sub-info strong {
      color: var(--text-primary);
      font-weight: 600;
    }

    .divider {
      width: 100%;
      height: 1px;
      background: #e5e5e5;
      margin: 30px 0;
    }

    .meta-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.85em;
      color: var(--text-secondary);
    }

    .meta-date {
      font-variant-numeric: tabular-nums;
    }

    .meta-love {
      color: var(--accent);
    }

    /* 旋转唱片 */
    .record {
      position: fixed;
      bottom: 24px;
      right: 24px;
      width: 48px;
      height: 48px;
      background-image: url('./custom-icon.png');
      background-size: cover;
      border-radius: 50%;
      animation: spin 4s linear infinite;
      cursor: pointer;
      z-index: 999;
      box-shadow: 0 2px 15px rgba(0, 0, 0, 0.1);
      transition: transform 0.2s;
    }

    .record:hover {
      transform: scale(1.1);
    }

    .paused {
      animation-play-state: paused;
      opacity: 0.5;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* 响应式 - 手机 */
    @media (max-width: 480px) {
      .big-number {
        font-size: 5.5em;
      }
      .names-row {
        margin-bottom: 40px;
      }
      .container {
        max-width: 100%;
      }
      .record {
        width: 40px;
        height: 40px;
        bottom: 16px;
        right: 16px;
      }
      body {
        padding: 30px 20px;
      }
    }
  </style>
</head>
<body>
  <div class="top-line"></div>

  <div class="container">
    <div class="names-row">
      <div class="name">陈帅林</div>
      <div class="heart-sep">♥</div>
      <div class="name name-right">张胜芸</div>
    </div>

    <div class="label">我们已经在一起</div>
    <div class="big-number">
      <span id="day-count">673</span><span class="unit">天</span>
    </div>

    <div class="timer">
      <div class="timer-item">
        <div class="timer-num" id="hour-count">00</div>
        <div class="timer-label">小时</div>
      </div>
      <div class="timer-item">
        <div class="timer-num" id="minute-count">00</div>
        <div class="timer-label">分钟</div>
      </div>
      <div class="timer-item">
        <div class="timer-num" id="second-count">00</div>
        <div class="timer-label">秒</div>
      </div>
    </div>

    <div class="sub-info">
      大约 <strong id="month-count">22</strong> 个月零 <strong id="day-remain">4</strong> 天
    </div>

    <div class="divider"></div>

    <div class="meta-row">
      <div class="meta-date">2024.11.30</div>
      <div class="meta-love">永远 ♥</div>
    </div>
  </div>

  <!-- 背景音乐 -->
  <audio id="bg-music" autoplay loop>
    <source src="dream-wedding.mp3" type="audio/mpeg">
    您的浏览器不支持 audio 标签。
  </audio>

  <!-- 唱片播放控制 -->
  <div class="record" id="record-icon" title="点击暂停/播放"></div>

  <script>
    // 起始日期
    const startDate = new Date("2024-11-30");

    const dayCountEl = document.getElementById("day-count");
    const monthCountEl = document.getElementById("month-count");
    const dayRemainEl = document.getElementById("day-remain");
    const hourCountEl = document.getElementById("hour-count");
    const minuteCountEl = document.getElementById("minute-count");
    const secondCountEl = document.getElementById("second-count");

    function pad(num) {
      return num.toString().padStart(2, "0");
    }

    function updateDate() {
      const now = new Date();
      const diffTime = now - startDate;
      const days = Math.floor(diffTime / (1000 * 60 * 60 * 24));
      const hours = Math.floor((diffTime % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      const minutes = Math.floor((diffTime % (1000 * 60 * 60)) / (1000 * 60));
      const seconds = Math.floor((diffTime % (1000 * 60)) / 1000);

      let months = (now.getFullYear() - startDate.getFullYear()) * 12 + (now.getMonth() - startDate.getMonth());
      if (now.getDate() < startDate.getDate()) months--;

      let remainingDays = now.getDate() - startDate.getDate();
      if (remainingDays < 0) {
        const lastMonthDays = new Date(now.getFullYear(), now.getMonth(), 0).getDate();
        remainingDays += lastMonthDays;
      }

      dayCountEl.textContent = days;
      monthCountEl.textContent = months;
      dayRemainEl.textContent = remainingDays;
      hourCountEl.textContent = pad(hours);
      minuteCountEl.textContent = pad(minutes);
      secondCountEl.textContent = pad(seconds);
    }

    updateDate();
    setInterval(updateDate, 1000);

    // 背景音乐控制
    const audio = document.getElementById("bg-music");
    const record = document.getElementById("record-icon");
    record.addEventListener("click", () => {
      if (audio.paused) {
        audio.play();
        record.classList.remove("paused");
      } else {
        audio.pause();
        record.classList.add("paused");
      }
    });
  </script>
</body>
</html>
